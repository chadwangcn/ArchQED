name: Publish ArchQED v0.1.0

on:
  push:
    paths:
      - .archqed-bootstrap/TRIGGER2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone current branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Restore, verify, and publish source tree
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          if compgen -G '.archqed-bootstrap/part-*' >/dev/null; then
            cat .archqed-bootstrap/part-* > /tmp/archqed.tar.gz.b64
            base64 --decode /tmp/archqed.tar.gz.b64 > /tmp/archqed.tar.gz
            echo "8574185819ad3cc7cf25b92ad8eb9c9352463efbc4d98bf4298445d667fb7e65  /tmp/archqed.tar.gz" | sha256sum --check -
            tar -xzf /tmp/archqed.tar.gz -C .
          fi
          rm -rf .archqed-bootstrap
          rm -f .github/workflows/bootstrap-release.yml
          rm -f .github/workflows/bootstrap-release-v2.yml
          if [[ -x scripts/verify.sh ]]; then
            ./scripts/verify.sh
          fi
          git config user.name "ArchQED Release Bot"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: release ArchQED v0.1.0 evidence-first workflow"
            git push origin HEAD:main
          fi
