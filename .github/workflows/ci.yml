name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: ./scripts/verify.sh

  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: |
          $Target = Join-Path $env:RUNNER_TEMP "archqed-smoke"
          New-Item -ItemType Directory -Force $Target | Out-Null
          Set-Content -Path (Join-Path $Target "go.mod") -Value "module example.com/smoke`n`ngo 1.22`n"
          ./scripts/bootstrap.ps1 -Target $Target
          & (Join-Path $Target "scripts/archqed.ps1") doctor --json
          & (Join-Path $Target "scripts/archqed.ps1") sync --check --json
