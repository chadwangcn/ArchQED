[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archqed"
version = "0.1.0"
description = "Compile human architecture into evidence-backed agent work."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Chad Wang"}]

[project.scripts]
archqed = "archqed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
